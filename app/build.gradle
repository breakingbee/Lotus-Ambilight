plugins {
    id "com.android.application"
}

android {
    namespace "com.breakingbee.lotusambilight"
    compileSdk 35

    defaultConfig {
        applicationId "com.breakingbee.lotusambilight"
        minSdk 23
        targetSdk 32
        versionCode 7
        versionName "0.1.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}
